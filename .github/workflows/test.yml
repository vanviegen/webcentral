# Runs the test suite on every push and pull request.
#
# Releasing is a separate workflow that only fires on a version tag, so pushing a branch runs
# these tests and publishes nothing.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.mode }} podman
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The two halves of the container-ownership invariant, neither of which exercises the
        # other: a non-root webcentral runs podman as itself and maps other uids with
        # `--userns=keep-id`, while a root one spawns podman as each project's owner. The tests
        # that skip in each mode are not the same ones.
        mode: [rootless, root]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install podman
        run: |
          if ! command -v podman > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          # Rootless podman needs a subordinate id range for the user invoking it.
          user=$(id -un)
          grep -q "^$user:" /etc/subuid \
            || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$user"

      - name: Create a project owner who has never logged in
        if: matrix.mode == 'root'
        run: |
          # No login, no `loginctl enable-linger`, no systemd user session - the state a real
          # project owner is in, and the one that used to break rootless podman for want of an
          # XDG_RUNTIME_DIR and a cgroup manager. Failing here fails the job rather than letting
          # the test quietly fall back to the runner's own account.
          sudo useradd --create-home --shell /usr/sbin/nologin webcentral-owner
          sudo usermod --add-subuids 200000-265535 --add-subgids 200000-265535 webcentral-owner
          uid=$(id -u webcentral-owner)
          test ! -e "/run/user/$uid"

      - name: Build
        run: cargo build

      - name: Test
        run: |
          set -o pipefail
          # --require turns a skip into a failure, so a green run is proof the mode covered what
          # it exists to cover rather than quietly skipping it as the developer machine does.
          # keep-id is a rootless feature, so only that job can require it; the root job exists
          # to prove the other half - podman spawned as a project's owner rather than as root.
          keepid=test_podman_user_override,test_podman_foreign_user_mapped_to_owner
          if [ "${{ matrix.mode }}" = root ]; then
            sudo --preserve-env=PATH env WEBCENTRAL_TEST_OWNER=webcentral-owner ./test.py \
              --require "test_podman_runs_as_the_project_owner" 2>&1 | tee test-output.log
          else
            ./test.py --require "$keepid" 2>&1 | tee test-output.log
          fi

      - name: Report what failed
        if: failure()
        run: |
          # As annotations, not just log lines: the API serves these without a token, so a failure
          # is legible to anything that can reach the repository rather than only in the web UI.
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' test-output.log \
            | grep -aE '✗|Error:|At:|Required tests were skipped|assert' \
            | tail -25 \
            | while IFS= read -r line; do echo "::error::$line"; done
          # Only the logs that actually say something went wrong, and enough of them to see what:
          # a build failure puts the package manager's own output here, which is the part worth
          # reading and the first thing a 15-line tail loses.
          for log in .test-tmp/*/_webcentral_data/log/*; do
            [ -f "$log" ] || continue
            sudo grep -qiE 'error|failed|not found' "$log" || continue
            echo "::error::--- $(basename "$(dirname "$(dirname "$log")")")"
            sudo tail -60 "$log" | cut -c1-400 | while IFS= read -r line; do echo "::error::$line"; done
          done
